<!doctype html>
<meta charset="utf-8">
<title>23AG hero — frame renderer</title>
<!--
  The 23ag.one sky row as the site lays it out on a phone: the ASCII flock on
  top (7 birds, one per row, 32 columns, centred), the "bigwm" canvas below at
  full width — a field of symbols masked to "23AG" in Times New Roman Bold,
  on the site's grid (height / 22, symbols at 0.8 of a cell).

  Rewritten as a pure function of the frame number so record.mjs can capture a
  seamless loop: every random event of the live site (symbol swaps, cells
  blinking, glint passes, colour flashes, bird drift) is laid out on the loop
  period. Fonts: Times New Roman (msttcorefonts), DejaVu Sans for symbols.
-->
<style>body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const W = 846, PAD = 24, PAD_Y = 12;
const DPR = 2;
const FRAMES = 480;              // 45 ms per frame, as on the site → 21.6 s loop
const TICKS = FRAMES * 45 / 150; // 144 flock ticks (the site's birds step every 150 ms)
const TAU = Math.PI * 2;
const GLYPHS = ['*', '+', '·', '✦', '⋆', '◦', '°', '∘', ':', '✳', '•', '×'];
const REEL = ['\\·/', '~·~', '-·-', '/·\\', '-·-', '~·~'];

let seed = 23;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
const rg = () => (rnd() * GLYPHS.length) | 0;
// symbols change only on flock ticks: between ticks just the glint moves, so
// WebP stores small sub-frames instead of whole ones
const tickFrame = (k) => Math.ceil(k * 10 / 3) % FRAMES;
const onTick = () => tickFrame((rnd() * TICKS) | 0);

// ── layout: the site's mobile sky row (flock above, word full width) ──
const SKY_FS = 16, SKY_LH = SKY_FS * 1.5, SKY_ROWS = 7;                     // .sky at ≤720 px, compacted
const PITCH = SKY_FS * 0.6;                      // monospace advance of the site's <pre>
const SKY_COLS = Math.floor((W - PAD * 2) / PITCH);   // the sky spans the full width
const SKY_W = SKY_COLS * PITCH, SKY_H = SKY_ROWS * SKY_LH;
const GAP = 20;                                  // air between the flock and the word
const CW = W - PAD * 2;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const probe = document.createElement('canvas').getContext('2d');
probe.font = '700 100px "Times New Roman"';
// the site sizes the mask font as H·0.92 and caps it at 0.98·W; pick H so both meet
const CH = Math.round(100 * CW * 0.98 / probe.measureText('23AG').width / 0.92);
const field = document.createElement('canvas');   // the word is drawn off-screen, then placed
field.width = Math.ceil(CW * DPR); field.height = Math.ceil(CH * DPR);
const fx = field.getContext('2d');

// ── the site's resize(): grid of symbol cells + mask font ──
const STEP = Math.max(9, Math.round(Math.min(CW, CH) / 30));   // site: /22 — denser here, the word reads heavier
const GLYPH_FONT = `${Math.round(STEP * 1.05)}px "DejaVu Sans"`;
const cols = Math.ceil(CW / STEP), rows = Math.ceil(CH / STEP);
const cells = [];
for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
  const x = c * STEP + STEP / 2, y = r * STEP + STEP / 2, nx = x / CW, ny = y / CH;
  const cell = { x, y, nx, ny, hb: nx * 300 + ny * 120 };
  // symbols: one per glint pass, swapped when the band sweeps over the cell (see below)
  cell.g = Array.from({ length: 4 }, rg);
  cell.off = rnd() < 0.04 ? [[0, FRAMES]] : [];      // a few cells stay dark, as on the site
  cells.push(cell);
}
let fs = CH * 0.92;
fx.font = `700 ${fs}px "Times New Roman"`;
const tw = fx.measureText('23AG').width;
if (tw > CW * 0.98) fs *= (CW * 0.98) / tw;
const MASK_FONT = `700 ${fs}px "Times New Roman"`;
fx.font = MASK_FONT; fx.textBaseline = 'middle';
const wm = fx.measureText('23AG');
// the site's canvas has air above and below the word; here the image is cut to the word
const WORD_H = wm.actualBoundingBoxAscent + wm.actualBoundingBoxDescent + STEP;
const H = Math.ceil(PAD_Y + SKY_H + GAP + WORD_H + PAD_Y);
const SKY_X = (W - SKY_W) / 2, SKY_Y = PAD_Y;      // .sky { align-self: center }
const CX = PAD;
const CY = PAD_Y + SKY_H + GAP + WORD_H / 2 - (CH / 2 + (wm.actualBoundingBoxDescent - wm.actualBoundingBoxAscent) / 2);
canvas.width = W * DPR; canvas.height = H * DPR;
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';

// ── glint passes and flashes, one every ~5 s like the site ──
const PASS = FRAMES / 4;                          // 4 passes, bandSp = 0.283
const passes = Array.from({ length: 4 }, () => {
  const ang = rnd() * TAU;
  return { ca: Math.cos(ang), sa: Math.sin(ang), bw: 0.13 + rnd() * 0.09 };
});
const HUE_DIR = rnd() < 0.5 ? 1 : -1;
const FLASHES = [70, 215, 390];

// ── flock: 7 birds spread evenly over the full width, rows shuffled so they don't
// line up as a staircase. All glide one way at one speed (exactly one wrap per loop),
// so the spacing holds and they never bunch up; each flaps at its own pace.
const WRAP = SKY_COLS + 3;
const ROW_ORDER = [3, 0, 5, 2, 6, 1, 4];
const DIR = rnd() < 0.5 ? -1 : 1;
const birds = ROW_ORDER.map((r, i) => ({
  r, x0: i * WRAP / ROW_ORDER.length + (rnd() - 0.5) * 3,
  f: (rnd() * 6) | 0, sp: 1 + ((rnd() * 2) | 0),
  vx: DIR * WRAP / TICKS                                   // ≈0.6 col per tick
}));

function on(c, f) { for (const [a, b] of c.off) if ((f >= a && f < b) || (f + FRAMES >= a && f + FRAMES < b)) return false; return true; }
// the glint reshuffles the field: a cell takes its next symbol once the band's head has passed
// it. The site swaps cells at random all over the word; keeping swaps inside the moving band
// keeps each WebP sub-frame to the band instead of the whole word.
function glyph(c, f) {
  const k = Math.floor(f / PASS), p = passes[k], head = ((f % PASS) / PASS) * 1.7 - 0.25;
  const passed = c.nx * p.ca + c.ny * p.sa < head;
  return GLYPHS[c.g[passed ? k : (k + 3) % 4]];
}

window.draw = function (f, theme) {
  const INK = theme === 'dark' ? '#E6EDF3' : 'rgb(26,26,23)';
  const SKY = theme === 'dark' ? '#7D8590' : '#A7A49B';
  const LIGHT = theme === 'dark' ? 62 : 55;
  const t = f * 0.05;

  // the field, exactly as the site's paint()
  fx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fx.globalCompositeOperation = 'source-over';
  fx.clearRect(0, 0, CW, CH);
  fx.font = GLYPH_FONT; fx.textAlign = 'center'; fx.textBaseline = 'middle';
  const p = passes[Math.floor(f / PASS)];
  const head = ((f % PASS) / PASS) * 1.7 - 0.25;
  let flash = 0;
  for (const s of FLASHES) if (f >= s) flash = Math.max(flash, 1 - (f - s) * 0.07);
  // hue is fixed for a pass (the site drifts it every frame): with a drifting hue
  // every coloured cell changes every frame and the WebP doubles in weight
  const thue = Math.floor(f / PASS) * 90 * HUE_DIR;
  for (const c of cells) {
    if (!on(c, f)) continue;
    const d = Math.abs(c.nx * p.ca + c.ny * p.sa - head);
    let band = d < p.bw ? 1 - d / p.bw : 0; band = band * band * (3 - 2 * band);
    const gI = band > flash ? band : flash;
    if (band > 0.2 || flash > 0.3) {
      let hue = (c.hb + thue) % 360; if (hue < 0) hue += 360;
      fx.fillStyle = `hsl(${hue | 0} 88% ${LIGHT}%)`;
    } else fx.fillStyle = INK;
    fx.fillText(glyph(c, f), c.x, c.y);
  }
  fx.globalCompositeOperation = 'destination-in';
  fx.fillStyle = '#000'; fx.font = MASK_FONT;
  fx.fillText('23AG', CW / 2, CH / 2);            // centre/middle, as the site leaves them set

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(field, Math.round(CX * DPR), Math.round(CY * DPR));

  // the flock: whole birds only, one per row
  const tick = Math.floor(f * 45 / 150);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.font = `${SKY_FS}px "DejaVu Sans"`; ctx.fillStyle = SKY; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const b of birds) {
    const x = (((b.x0 + b.vx * tick) % WRAP) + WRAP) % WRAP - 3;
    const col = Math.round(x);
    if (col < 0 || col + 3 > SKY_COLS) continue;
    const frame = REEL[(b.f + tick * b.sp) % REEL.length];
    const y = SKY_Y + b.r * SKY_LH + SKY_LH / 2;
    for (let k = 0; k < 3; k++) ctx.fillText(frame[k], SKY_X + (col + k) * PITCH + PITCH / 2, y);
  }
};
window.SIZE = { W, H, DPR, FRAMES };
</script>
