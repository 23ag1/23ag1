<!doctype html>
<meta charset="utf-8">
<title>23AG hero — frame renderer</title>
<!--
  The 23ag.one "bigwm" canvas and ASCII flock, rewritten as a pure function of
  the frame number so it can be recorded into a seamless loop (record.mjs).
  Every random event of the live site is laid out on the loop period instead:
  twinkle, symbol swaps, cells blinking out, two glint sweeps, one flash.
  Fonts come from the system: Times New Roman (msttcorefonts), DejaVu Sans.
-->
<style>body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const W = 846, PAD = 24, SKY_H = 132;
const DPR = 2;
const FRAMES = 200;              // 45 ms per frame, as on the site → 9 s loop
const TAU = Math.PI * 2;
const GLYPHS = ['*', '+', '·', '✦', '⋆', '◦', '°', '∘', ':', '✳', '•', '×'];
const REEL = ['\\·/', '~·~', '-·-', '/·\\', '-·-', '~·~'];

// deterministic RNG, so both themes and every re-record get the same field
let seed = 23;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
const rg = () => (rnd() * GLYPHS.length) | 0;
// symbols change only on flock ticks (every 150 ms, like the site's birds): between
// ticks just the glint band moves, so WebP stores small sub-frames, not whole ones
const onTick = () => Math.ceil(((rnd() * 60) | 0) * 10 / 3) % FRAMES;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// word: Times New Roman Bold, fitted between the side margins
const WORD_W = W - PAD * 2;
ctx.font = '700 100px "Times New Roman"';
let m = ctx.measureText('23AG');
const FS = 100 * WORD_W / (m.actualBoundingBoxRight + m.actualBoundingBoxLeft);
const MASK_FONT = `700 ${FS}px "Times New Roman"`;
ctx.font = MASK_FONT; m = ctx.measureText('23AG');
const WORD_TOP = PAD + SKY_H;
const BASE = WORD_TOP + m.actualBoundingBoxAscent;
const WORD_X = PAD + m.actualBoundingBoxLeft;
const H = Math.ceil(BASE + m.actualBoundingBoxDescent + PAD);
canvas.width = W * DPR; canvas.height = H * DPR;
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';

// symbol cells over the word's box
const STEP = 11, GLYPH_FONT = '15px "DejaVu Sans"';
const cells = [];
for (let y = WORD_TOP - STEP; y < BASE + STEP; y += STEP)
  for (let x = PAD - STEP; x < W - PAD + STEP; x += STEP) {
    const c = { x: x + STEP / 2, y: y + STEP / 2, nx: (x - PAD) / WORD_W, ny: (y - WORD_TOP) / (BASE - WORD_TOP),
      ph: rnd() * TAU, hb: 0, swaps: [], blink: null };
    c.hb = c.nx * 300 + c.ny * 120;
    // symbol swaps: the site flips ~1.3% of cells per tick → ~2-3 per cell per loop
    const n = (rnd() * 4) | 0, times = [];
    for (let i = 0; i < n; i++) times.push(onTick());
    times.sort((a, b) => a - b);
    c.swaps = [[0, rg()], ...times.map(t => [t, rg()])];
    // ~10% of cells are dark at any moment; some blink out for a while
    if (rnd() < 0.1) c.blink = [0, FRAMES];
    else if (rnd() < 0.3) { const a = onTick(); c.blink = [a, a + Math.ceil((3 + ((rnd() * 12) | 0)) * 10 / 3)]; }
    cells.push(c);
  }

// two glint passes per loop (the site re-rolls direction every ~4 s); angles
// kept within ±35° of horizontal, so every pass actually crosses the word
const passes = [0.45, -0.6].map((span) => {
  const ang = span * rnd();
  return { ca: Math.cos(ang), sa: Math.sin(ang), bw: 0.13 + rnd() * 0.09 };
});
const HUE_SP = 108, HUE_DIR = rnd() < 0.5 ? 1 : -1;   // 108 × 10 = 3 full turns per loop
const FLASH_AT = 136;

// flock: each lane repeats a pattern of period P columns and moves exactly one
// P per loop, so the loop is seamless. Inside a period birds sit at random,
// non-overlapping columns — a dense, uneven flock rather than a grid.
// Birds are drawn whole or not at all, like the site.
const B_FS = 20, PITCH = B_FS * 0.62, COLS = Math.floor((W - PAD * 2) / PITCH), BW = 3;
const WRAP = COLS + BW, TICKS = FRAMES * 45 / 150;       // 60 flock ticks per loop
const LANES = 7, LANE_GAP = (SKY_H - 22) / (LANES - 1);
const lanes = Array.from({ length: LANES }, (_, r) => {
  const n = rnd() < 0.5 ? 2 : 3;                          // 2–3 repeats → 0.37–0.55 col per tick
  const P = WRAP / n, birds = [];
  const per = n === 2 ? 4 + ((rnd() * 2) | 0) : 3 + ((rnd() * 2) | 0);
  for (let tries = 0; birds.length < per && tries < 50; tries++) {
    const x = rnd() * (P - BW - 1);
    if (birds.every(b => Math.abs(b.x - x) > BW + 1)) birds.push({ x, f: (rnd() * 6) | 0, sp: rnd() < 0.5 ? 1 : 2 });
  }
  return { r, n, P, dir: rnd() < 0.5 ? -1 : 1, off: rnd() * WRAP, birds };
});

function isOn(c, f) {
  if (!c.blink) return true;
  const [a, b] = c.blink;
  return !((f >= a && f < b) || (f + FRAMES >= a && f + FRAMES < b));
}
function glyphAt(c, f) { let g = c.swaps[0][1]; for (const [t, v] of c.swaps) if (t <= f) g = v; return GLYPHS[g]; }

window.draw = function (f, theme) {
  const INK = theme === 'dark' ? '#E6EDF3' : 'rgb(26,26,23)';
  const SKY = theme === 'dark' ? '#7D8590' : '#A7A49B';
  const LIGHT = theme === 'dark' ? 62 : 52;
  const t = f * 0.05;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);

  // the field
  const pass = passes[f < FRAMES / 2 ? 0 : 1];
  const head = ((f % (FRAMES / 2)) / (FRAMES / 2)) * 1.7 - 0.25;
  let flash = f >= FLASH_AT ? 1 - (f - FLASH_AT) * 0.07 : 0; if (flash < 0) flash = 0;
  const thue = t * HUE_SP * HUE_DIR;
  ctx.font = GLYPH_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const c of cells) {
    if (!isOn(c, f)) continue;
    const d = Math.abs(c.nx * pass.ca + c.ny * pass.sa - head);
    let band = d < pass.bw ? 1 - d / pass.bw : 0; band = band * band * (3 - 2 * band);
    const gI = Math.max(band, flash);
    // the site's twinkle (±2% opacity) is dropped: invisible, but it made every
    // frame differ everywhere and the WebP five times heavier
    ctx.globalAlpha = Math.min(1, 0.9 + gI * 0.1);
    if (band > 0.2 || flash > 0.3) {
      let hue = (c.hb + thue) % 360; if (hue < 0) hue += 360;
      ctx.fillStyle = `hsl(${hue | 0} 88% ${LIGHT}%)`;
    } else ctx.fillStyle = INK;
    ctx.fillText(glyphAt(c, f), c.x, c.y);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'destination-in';
  ctx.font = MASK_FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#000';
  ctx.fillText('23AG', WORD_X, BASE);
  // keep the sky: destination-in wiped it, so the flock is drawn after
  ctx.globalCompositeOperation = 'source-over';

  const tick = Math.floor(f * 45 / 150);
  ctx.font = `${B_FS}px "DejaVu Sans"`; ctx.fillStyle = SKY; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const lane of lanes) {
    const shift = lane.dir * (tick / TICKS) * lane.P;
    const y = PAD + 8 + lane.r * LANE_GAP;
    for (let rep = 0; rep < lane.n; rep++) for (const b of lane.birds) {
      const col = Math.round((((lane.off + rep * lane.P + b.x + shift) % WRAP) + WRAP) % WRAP) - BW;
      if (col < 0 || col + BW > COLS) continue;               // only whole birds
      const frame = REEL[(b.f + tick * b.sp) % REEL.length];
      for (let k = 0; k < 3; k++) ctx.fillText(frame[k], PAD + (col + k) * PITCH + PITCH / 2, y);
    }
  }
};
window.SIZE = { W, H, DPR, FRAMES };
</script>
